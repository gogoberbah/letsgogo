<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - Futsal Delayota</title>

	<link rel="stylesheet" href="style.css">
</head>
<body>

	<div class="auth-wrapper">

		<div class="auth-container">

			<!-- LEFT SIDE -->

			<div class="auth-left">

				<h1>JOIN DELAYOTA</h1>

				<p>
					Create your futsal account and start booking your favorite field with modern blue minimalist style.
				</p>

			</div>

			<!-- RIGHT SIDE -->

			<div class="auth-box">

				<h2>Create Account</h2>

				<form id="registerForm" class="auth-form">

					<input
						type="text"
						id="username"
						placeholder="Username"
						required
					>

					<input
						type="email"
						id="email"
						placeholder="Email"
						required
					>

					<input
						type="password"
						id="password"
						placeholder="Password"
						required
					>

					<button type="submit">
						Register
					</button>

				</form>

				<div class="auth-bottom">
					Already have an account?
					<a href="index.html">Login</a>
				</div>

			</div>

		</div>

	</div>

	<script src="js/register.js"></script>

</body>
</html>
