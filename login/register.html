<!DOCTYPE html>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">
    <div class="left-content">
      <h1>JOIN FUTSAL</h1>
      <p>
        Create your account and start booking your favorite futsal field.
        Tiny rectangles of digital bureaucracy. Humanity's greatest invention.
      </p>
    </div>

    <div class="login-box">
      <h2>Create Account</h2>

      <form id="registerForm">

        <input
          type="email"
          id="email"
          placeholder="email"
          required
        >

        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          REGISTER
        </button>

      </form>

      <div class="bottom-text">
        Already have an account?
        <a href="index.html">Login</a>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
