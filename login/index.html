<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Login - Futsal Delayota</title>

	<link rel="stylesheet" href="style.css">
</head>

<body class="is-preload">

	<!-- Wrapper -->
	<div id="wrapper">

		<!-- Background -->
		<div class="bg fixed"></div>

		<!-- LOGIN -->
		<section class="auth-wrapper">

			<div class="auth-container">

				<!-- LEFT -->

				<div class="auth-left">

					<h1>FUTSAL DELAYOTA</h1>

					<p>
						Modern futsal booking platform with clean blue minimalist style.
					</p>

				</div>

				<!-- RIGHT -->

				<div class="auth-box">

					<h2>Login Account</h2>

					<form id="loginForm" class="auth-form">

						<input
							type="text"
							id="username"
							placeholder="Username"
							required
						>

						<input
							type="password"
							id="password"
							placeholder="Password"
							required
						>

						<button type="submit">
							Login
						</button>

					</form>

					<div class="auth-bottom">
						Don't have an account?
						<a href="register.html">Register</a>
					</div>

				</div>

			</div>

		</section>

	</div>

	<script src="js/login.js"></script>

</body>
</html>
