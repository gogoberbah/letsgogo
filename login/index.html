<div class="auth-wrapper">

  <div class="auth-container">

    <div class="auth-left">
      <h1>FUTSAL DELAYOTA</h1>

      <p>
        Modern futsal booking platform with clean blue minimalist style.
      </p>
    </div>

    <div class="auth-box">

      <h2>Login Account</h2>

      <form id="loginForm" class="auth-form">

        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <div class="auth-bottom">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>

    </div>

  </div>

</div>

  <script src="js/login.js"></script>
</body>
</html>
