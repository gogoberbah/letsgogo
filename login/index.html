<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futsal Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">
    <div class="left-content">
      <h1>FUTSAL ARENA</h1>
      <p>
        Modern futsal booking platform with clean minimalist design.
        Because apparently humans now need glowing login forms just to type passwords.
      </p>
    </div>

    <div class="login-box">
      <h2>Login Account</h2>

      <form id="loginForm">

        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          LOGIN
        </button>

      </form>

      <div class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
